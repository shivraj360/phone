<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="phone">
        <div class="lock-screen">

            <div class="top-display-bar">
                <div class="time"></div>
                <div class="camera"></div>
                <div class="right-display-bar">
                    <div class="network"><i class="fa-solid fa-signal"></i></div>
                    <div class="battery"><i class="fa-solid fa-battery-three-quarters"></i></div>

                </div>
            </div>

            
            <h1 class="lock-h1">Lock Screen</h1>
            <button id="change-background">C</button>

            <button id="homebtn">home</button>
        </div>

        <div class="home-screen">
            <div class="top-display-bar">
                <div class="time"></div>
                <div class="camera"></div>
                <div class="right-display-bar">
                    <div class="network"><i class="fa-solid fa-signal"></i></div>
                    <div class="battery"><i class="fa-solid fa-battery-three-quarters"></i></div>

                </div>
            </div>



           <button id="lockbtn">Lock</button>


           <div class="apps">


                <div id="a1" class="app">
                    <h2><i class="fa-solid fa-book-open"></i></h2>
                    
                </div>
                <div class="app">
                    <i class="fa-brands fa-react"></i>
                    
                </div>
                <div class="app">
                    <i class="fa-solid fa-calculator"></i>
                    
                </div>
                <div class="app">
                    <i class="fa-regular fa-message"></i>
                    
                </div>

                <div class="app">
                    <i class="fa-brands fa-instagram"></i>
                    
                </div>
                <div class="app">
                    <i class="fa-solid fa-paper-plane"></i>
                    
                </div>
                <div class="app">
                    <i class="fa-brands fa-facebook"></i>
                    
                </div>
                <div class="app">
                    <i class="fa-solid fa-phone"></i>
                  
                </div>

                <div class="app">
                    <i class="fa-solid fa-folder-open"></i>
                    
                </div>
                <div class="app">
                    <i class="fa-solid fa-chess-knight"></i>
                    
                </div>
                <div class="app">
                    <i class="fa-solid fa-music"></i>
                   
                </div>
                <div class="app">
                    <i class="fa-brands fa-youtube"></i>
                  
                </div>

                <div class="app">
                    <i class="fa-solid fa-play"></i>
                    
                </div>
                <div class="app">
                    <i class="fa-brands fa-google"></i>
                    
                </div>
                <div class="app">
                    <i class="fa-brands fa-discord"></i>
                    
                </div>
                <div class="app">
                    <i class="fa-regular fa-image"></i>
                    
                </div>


           </div>

           


        </div>

        <div class="note-app">
            <div class="top-display-bar">
                <div class="time"></div>
                <div class="camera"></div>
                <div class="right-display-bar">
                    <div class="network"><i class="fa-solid fa-signal"></i></div>
                    <div class="battery"><i class="fa-solid fa-battery-three-quarters"></i></div>

                </div>
            </div>

            <div class="app-nav">
                <i class="fa-solid fa-person-walking-arrow-loop-left"></i>
                <i id="back-to-home" class="fa-solid fa-house"></i>
                
            </div>

            <div class="app-area">
                <input id="note-input" type="text" placeholder="write Here ...">
                <button id="note-addbtn">+ Add</button>
                <div class="data-display">
                    <p>shivraj</p>
                    
                    
                  
                </div>


            </div>



        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
